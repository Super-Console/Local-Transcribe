name: Windows validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          rustup show active-toolchain

      - name: Build and stage node sidecar (release)
        shell: pwsh
        run: |
          # tauri externalBin 在构建期就要求数字化 sidecar 存在（cargo test 阶段
          # tauri build script 无条件校验），否则 MSI 不含节点、7878 无法监听。
          # 先用 release 构建节点并 stage 到 binaries/，后续 test/clippy/build 复用。
          cargo build -p voice-to-text-lan --release --bin local-transcribe-node --locked
          $src = Join-Path $env:GITHUB_WORKSPACE 'target/release/local-transcribe-node.exe'
          if (-not (Test-Path -LiteralPath $src)) { throw "node sidecar missing at $src" }
          $destDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $dest = Join-Path $destDir 'local-transcribe-node-x86_64-pc-windows-msvc.exe'
          Copy-Item -LiteralPath $src -Destination $dest -Force
          $hash = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "SIDECAR=$dest SIZE=$((Get-Item -LiteralPath $dest).Length) SHA256=$hash"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Rust workspace (release)
        run: cargo build --workspace --release --locked

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Windows MSI installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles msi

      - name: Verify and stage Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'target/release/bundle/msi'),
            (Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/release/bundle/msi')
          )
          $msiDir = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $msiDir) { throw "No MSI bundle directory found. Checked: $($candidates -join ', ')" }
          $packages = @(Get-ChildItem -LiteralPath $msiDir -Filter '*.msi' -File)
          if ($packages.Count -lt 1) { throw "No MSI was produced in $msiDir" }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target/release/voice-to-text-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Windows executable missing at $exe" }
          $stage = Join-Path $env:RUNNER_TEMP 'voice-to-text-windows'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $packages[0].FullName -Destination $stage
          Copy-Item -LiteralPath $exe -Destination $stage
          foreach ($name in @('local-transcribe-node.exe', 'local-transcribe.exe', 'voice-to-text-service.exe')) {
            $tool = Join-Path $env:GITHUB_WORKSPACE "target/release/$name"
            if (-not (Test-Path -LiteralPath $tool)) { throw "Windows executable missing at $tool" }
            Copy-Item -LiteralPath $tool -Destination $stage
          }
          Get-ChildItem -LiteralPath $stage | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "STAGED=$($_.Name) SIZE=$($_.Length) SHA256=$hash"
          }

      - name: Upload Windows installer (expires in 7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-to-text-windows
          path: ${{ runner.temp }}/voice-to-text-windows/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
