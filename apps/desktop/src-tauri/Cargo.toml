[package]
name = "voice-to-text-desktop"
version = "1.5.0-beta.5"
description = "Local Transcribe — local-first desktop transcription."
authors = ["TimmySheep"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_to_text_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 单实例：第二次启动只唤回已有窗口，不再初始化状态（P1）。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice-to-text-core = { path = "../../../crates/transcription-core" }
voice-to-text-lan = { path = "../../../crates/lan-compute" }
voice-to-text-service = { path = "../../../crates/transcription-service" }
# 局域网 Client：节点探测超时与任务轮询计时（复用 Tauri 自带的 tokio）。
tokio = { version = "1", features = ["time"] }
# 节点 id 派发 UUID v4（与 lan-compute 的任务 id 同一格式）。
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
cpal = "0.16"
hound = "3"
# 官方模型下载：流式读取 + 系统 TLS（macOS Security.framework / Windows SChannel，
# 不需要交叉编译 C 依赖）。仅本机直连 Hugging Face 及其镜像。
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls"] }
arboard = { version = "3", default-features = false }
sha2 = "=0.10.9"
sysinfo = "=0.39.6"

# 断点续传测试：本地 HTTP 服务器模拟 206/Range 与中途断流（仅测试使用）。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# 退出清理测试需要 Tauri 的 MockRuntime；`test` feature 无额外依赖。
# 只在非 Windows 启用：Windows 上把 llama.cpp（/MT 静态 CRT）拉进测试可执行
# 文件会与 Rust 默认的 /MD 运行库混用，进程在加载期即
# STATUS_ENTRYPOINT_NOT_FOUND（0xc0000139）。Metal 退出断言本身也只存在于 macOS。
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.191"
core-foundation = "0.10"
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSImage", "NSTitlebarAccessoryViewController", "NSViewController", "NSView", "NSWindow", "NSLayoutConstraint", "NSResponder", "NSControl", "NSCell", "NSButtonCell"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObject"] }

# Windows 应用音频：Application Loopback（WASAPI 按进程捕获）与窗口枚举。
# windows-core 直接依赖：#[implement] 宏代码生成需要（windows 0.61 实测）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }
windows-core = "0.61"
