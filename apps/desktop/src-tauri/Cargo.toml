[package]
name = "voice-to-text-desktop"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_to_text_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice-to-text-core = { path = "../../../crates/transcription-core" }
voice-to-text-service = { path = "../../../crates/transcription-service" }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSImage", "NSTitlebarAccessoryViewController", "NSViewController", "NSView", "NSWindow", "NSLayoutConstraint", "NSResponder", "NSControl", "NSCell", "NSButtonCell"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObject"] }
