[package]
name = "voice-to-text-desktop"
version = "1.1.0-beta.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_to_text_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice-to-text-core = { path = "../../../crates/transcription-core" }
voice-to-text-lan = { path = "../../../crates/lan-compute" }
voice-to-text-service = { path = "../../../crates/transcription-service" }
# 局域网 Client：节点探测超时与任务轮询计时（复用 Tauri 自带的 tokio）。
tokio = { version = "1", features = ["time"] }
# 节点 id 派发 UUID v4（与 lan-compute 的任务 id 同一格式）。
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
cpal = "0.16"
hound = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSImage", "NSTitlebarAccessoryViewController", "NSViewController", "NSView", "NSWindow", "NSLayoutConstraint", "NSResponder", "NSControl", "NSCell", "NSButtonCell"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObject"] }
