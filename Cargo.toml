[workspace]
members = ["crates/transcription-core", "crates/transcription-mcp", "crates/transcription-service", "crates/transcription-cli", "apps/desktop/src-tauri"]
resolver = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
