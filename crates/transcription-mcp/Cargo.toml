[package]
name = "voice-to-text-mcp"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[[bin]]
name = "voice-to-text-mcp"
path = "src/main.rs"

[dependencies]
voice-to-text-core = { path = "../transcription-core" }
rmcp = { version = "=3.6.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
